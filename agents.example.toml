# Copy to agents.toml before starting the bot. Local agents.toml is gitignored.
# Keep API keys in environment variables or the ignored .env, never in TOML.
# Model settings are loaded once at startup. Restart after editing.
# Explicit values here override legacy LLM_URL / V4_* environment settings.
version = 1

[supervision]
enabled = true
max_calls = 6  # ordinary turns; creative turns use routing.creative_max_calls
progress_interval = 5
# director_evaluate = false  # omitted: V4_DIRECTOR_EVALUATE or false

[providers.local]
api = "ollama"
# base_url = "http://127.0.0.1:11434"  # omitted: LLM_URL or this default
# api_key_env = "OLLAMA_API_KEY"      # optional authenticated proxy

# Example hosted endpoint (uncomment and export the named secret):
# [providers.hosted]
# api = "openai"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# json_mode = true

# Each role independently selects a provider and model. Omitted model values
# inherit V4_DIGEST_MODEL (small roles) / V4_NARR_MODEL (narrator), then defaults:
# qwen2.5:7b-instruct / qwen3.5:35b. Optional keys: temperature, timeout,
# max_tokens, think (Ollama only), reasoning_effort (OpenAI-compatible only).
[roles.main]
provider = "local"
# model = "qwen2.5:7b-instruct"
max_tokens = 600

[roles.action]
provider = "local"
# model = "qwen2.5:7b-instruct"
max_tokens = 800 # Up to three linked steps, including material names and targets.

[roles.progress]
provider = "local"
# model = "qwen2.5:7b-instruct"
max_tokens = 600

[roles.director]
provider = "local"
# model = "qwen2.5:7b-instruct"
max_tokens = 1000

[roles.evaluator]
provider = "local"
# model = "qwen2.5:7b-instruct"
max_tokens = 200

[roles.narrator]
provider = "local"
# model = "qwen3.5:35b"
max_tokens = 400

# Jev routes and verifies operator candidates; generation stays with specialist models.
# Routing falls back to roles.router; reviews fall back directly to main/evaluator.
# No external Jev call occurs until TYPESAFE_API_KEY is set.
[routing]
# V4_SYSTEM_ONE_ENABLED=false in .env skips routing and all native operator checks.
enabled = true
backend = "auto"  # auto / jev / llm; llm also disables native operator checks
model = "jev-latest"
base_url = "https://api.typesafe.ai/v1"
api_key_env = "TYPESAFE_API_KEY"
timeout = 5
# Shared by direct routing and operator verification; both thresholds must pass.
probability = 0.85
confidence = 0.8
creative_max_calls = 8

[roles.router]
provider = "local"
max_tokens = 1600

[hints]
stalled_attempts = 3
cooldown = 3
